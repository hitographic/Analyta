# Deploy frontend Analyta (React+Vite single-file) ke GitHub Pages.
# Hasil build frontend/dist/index.html (~1 MB, JS+CSS inline) dipublish ke
# https://hitographic.github.io/Analyta — tanpa commit dist/ ke branch main.
# Catatan: di Pages tidak ada google.script.run, jadi app jalan MODE MOCK
# (data contoh, lihat frontend/src/gas.js). Simpan asli ke Sheet tetap via WebApp Apps Script.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
